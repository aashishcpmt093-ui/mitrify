# Checks for the Mitrify AI Gateway (server/gateway): TypeScript check of the whole server, the
# gateway tests against a mock provider, and the PostgreSQL storage tests on a throwaway database.
# No real provider is called and no secret is needed.

name: Gateway tests

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "shared/**"
      - "migrations/0012_ai_gateway*.sql"
      - "migrations/0013_api_portal*.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gateway-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - "shared/**"
      - "migrations/0012_ai_gateway*.sql"
      - "migrations/0013_api_portal*.sql"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gateway-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gw
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx tsc --noEmit -p .
      - name: Migrations apply, roll back and apply again
        env:
          PGPASSWORD: test
        run: |
          for f in migrations/0012_ai_gateway.sql migrations/0013_api_portal.sql; do
            psql -h 127.0.0.1 -U test -d gw -v ON_ERROR_STOP=1 -f $f
          done
          for f in migrations/0013_api_portal.down.sql migrations/0012_ai_gateway.down.sql; do
            psql -h 127.0.0.1 -U test -d gw -v ON_ERROR_STOP=1 -f $f
          done
          for f in migrations/0012_ai_gateway.sql migrations/0013_api_portal.sql; do
            psql -h 127.0.0.1 -U test -d gw -v ON_ERROR_STOP=1 -f $f
          done
      - run: npm run test:gateway
        env:
          GATEWAY_TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/gw
      - run: npm run build
