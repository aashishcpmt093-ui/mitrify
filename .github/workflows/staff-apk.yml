# Builds the clinic STAFF Android app (apps/staff-android) and attaches the APK to the "staff-app" release,
# so the download link stays the same after every build:
#   https://github.com/<owner>/<repo>/releases/download/staff-app/clinic-staff.apk
# The app opens the live staff page, so website updates need no new APK. Rebuild only when the app's
# name, icon or address changes.
#
# Run it: GitHub → Actions → "Build Staff Android app (APK)" → Run workflow.

name: Build Staff Android app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/staff-android/**"
      - ".github/workflows/staff-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/staff-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/staff-android/package-lock.json

      # Capacitor 7 needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Create the Android project with the clinic icon
        run: npm run android:prepare

      # Debug signing needs no keystore or secrets; the APK installs on any Android phone.
      - name: Build the APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/clinic-staff.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: clinic-staff-apk
          path: clinic-staff.apk
          retention-days: 30

      # One release, replaced on every build, so the download link never changes.
      - name: Publish to the "staff-app" release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete staff-app --yes --cleanup-tag || true
          gh release create staff-app clinic-staff.apk \
            --title "Clinic Staff app (Android)" \
            --notes "Built $(date -u '+%d %b %Y %H:%M') UTC from ${GITHUB_SHA::7}. Install on Android: download clinic-staff.apk, open it, allow installing from this source." \
            --latest=false

      - name: Summary
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## Clinic Staff app built"
            echo ""
            echo "Download on the phone: https://github.com/${GITHUB_REPOSITORY}/releases/download/staff-app/clinic-staff.apk"
            echo ""
            echo "Open the file and allow installing from this source when Android asks."
          } >> "$GITHUB_STEP_SUMMARY"
